name: Build Pre-Release
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  BuildPreRelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Checkout deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          touch id_ed25519
          echo "$DEPLOY_KEY" > id_ed25519
          chmod 600 ./id_ed25519

      - name: Checkout submodules
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ./id_ed25519
          git submodule update --init --recursive --force

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 --decode > release.keystore

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.27.3'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Signing properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          touch signing.properties
          echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
          echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
          echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties

      - name: Pre-release Build
        if: success()
        run: ./gradlew --no-daemon app:assembleAlphaRelease

      - name: Verify pre-release signing certificate
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail

          expected="${EXPECTED_CERT_SHA256//:/}"
          expected="${expected^^}"
          if [[ ! "$expected" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::RELEASE_SIGNING_CERT_SHA256 must be a 64-character SHA-256 certificate fingerprint (colons optional)."
            exit 1
          fi

          mapfile -t apksigners < <(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -perm -u+x | sort -V)
          if (( ${#apksigners[@]} == 0 )); then
            echo "::error::No executable apksigner found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          apksigner="${apksigners[-1]}"

          shopt -s nullglob
          apks=(app/build/outputs/apk/alpha/release/*.apk)
          shopt -u nullglob
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No alpha release APKs found"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            cert_output="$("$apksigner" verify --print-certs "$apk")"
            mapfile -t cert_digests < <(sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' <<< "$cert_output")
            if (( ${#cert_digests[@]} != 1 )); then
              echo "::error::Expected exactly one signer certificate in $apk"
              exit 1
            fi
            actual="${cert_digests[0]//:/}"
            actual="${actual^^}"
            if [[ ! "$actual" =~ ^[0-9A-F]{64}$ ]]; then
              echo "::error::Invalid signer certificate digest in $apk"
              exit 1
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Signing certificate mismatch for $apk"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi
            echo "Verified signing certificate: $apk"
          done

      # One `<apk>.sha256` file next to each APK, in `sha256sum` format.
      # The in-app updater downloads the matching file and refuses to
      # install an APK whose digest does not match.
      - name: Generate APK checksums
        if: success()
        run: |
          cd app/build/outputs/apk/alpha/release
          for apk in *.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done

      # Delete old Prerelease-alpha
      - uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: Prerelease-alpha
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true

      - name: Tag Repo
        uses: richardsimko/update-tag@v3
        with:
          tag_name: Prerelease-alpha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Alpha
        uses: softprops/action-gh-release@v3
        if: ${{  success() }}
        with:
          tag_name: Prerelease-alpha
          files: app/build/outputs/apk/alpha/release/*
          prerelease: true
          generate_release_notes: true
