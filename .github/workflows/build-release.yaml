name: Build Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release Tag (v12.x.x)'
        required: true

jobs:
  BuildRelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          touch id_ed25519
          echo "$DEPLOY_KEY" > id_ed25519
          chmod 600 ./id_ed25519

      - name: Checkout submodules
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ./id_ed25519
          git submodule update --init --recursive --force

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 --decode > release.keystore

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.27.3'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Validate version and immutable tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Invalid release tag"; exit 1; }
          version="${RELEASE_TAG#v}"
          IFS=. read -r major minor patch iteration <<< "$version"
          iteration="${iteration:-1}"
          (( 10#$minor <= 99 && 10#$patch <= 999 && 10#$iteration <= 99 )) || { echo "Version component out of range"; exit 1; }
          expected_code="$(printf '%d%02d%03d%02d' "$((10#$major))" "$((10#$minor))" "$((10#$patch))" "$((10#$iteration))")"
          grep -Fq "versionCode = $expected_code" build.gradle.kts || { echo "versionCode does not match tag"; exit 1; }
          grep -Fq "versionName = \"$version\"" build.gradle.kts || { echo "Tag must match committed versionName"; exit 1; }
          test -z "$(git status --porcelain -- build.gradle.kts)" || { echo "Version file must be committed"; exit 1; }
          existing_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          test -z "$existing_tag" || { echo "Release tag already exists"; exit 1; }

      - name: Signing properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          touch signing.properties
          echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
          echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
          echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties

      - name: Verify Android and Go tests
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-parallel --max-workers=1 :service:testMetaDebugUnitTest :app:testMetaDebugUnitTest :app:lintMetaDebug :app:lintAlphaDebug
          (cd core/src/main/golang/native && go test ./backup/...)
          (cd core/src/foss/golang/clash && go test -race ./component/trafficpolicy ./component/providerwrite)

      - name: Release Build
        if: success()
        run: ./gradlew --no-daemon --no-parallel --max-workers=1 app:assembleMetaRelease

      - name: Verify release signing certificate
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail

          expected="${EXPECTED_CERT_SHA256//:/}"
          expected="${expected^^}"
          if [[ ! "$expected" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::RELEASE_SIGNING_CERT_SHA256 must be a 64-character SHA-256 certificate fingerprint (colons optional)."
            exit 1
          fi

          mapfile -t apksigners < <(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -perm -u+x | sort -V)
          if (( ${#apksigners[@]} == 0 )); then
            echo "::error::No executable apksigner found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          apksigner="${apksigners[-1]}"

          shopt -s nullglob
          apks=(app/build/outputs/apk/meta/release/*.apk)
          shopt -u nullglob
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No meta release APKs found"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            cert_output="$("$apksigner" verify --print-certs "$apk")"
            mapfile -t cert_digests < <(sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' <<< "$cert_output")
            if (( ${#cert_digests[@]} != 1 )); then
              echo "::error::Expected exactly one signer certificate in $apk"
              exit 1
            fi
            actual="${cert_digests[0]//:/}"
            actual="${actual^^}"
            if [[ ! "$actual" =~ ^[0-9A-F]{64}$ ]]; then
              echo "::error::Invalid signer certificate digest in $apk"
              exit 1
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Signing certificate mismatch for $apk"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi
            echo "Verified signing certificate: $apk"
          done

      # One `<apk>.sha256` file next to each APK, in `sha256sum` format.
      # The in-app updater downloads the matching file and refuses to
      # install an APK whose digest does not match.
      - name: Generate APK checksums
        if: success()
        run: |
          cd app/build/outputs/apk/meta/release
          for apk in *.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done

      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          # The release tag points to the exact committed sources that were built.
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          GlonetX 12.13.0 adds Tailscale integration, a redesigned Compose dashboard and proxy controls, expanded network and kernel settings, and hardened encrypted backup, restore, update, and release-signing flows.

          See CHANGELOG.md for the full 12.13.0 change list.
          EOF
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" app/build/outputs/apk/meta/release/*.apk app/build/outputs/apk/meta/release/*.sha256 --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
